# Configuration for `cargo deny`, run by the supply-chain job in CI.
# See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The crate ships under MIT and vendors C sources, so a permissive-only policy
# keeps any future dependency from silently adding copyleft obligations.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
# A wildcard version requirement makes the build unreproducible.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
