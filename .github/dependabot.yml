version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    groups:
      cargo:
        patterns: ["*"]

  # Workflow action versions drift silently otherwise; a pinned-but-stale
  # action is the usual cause of a CI break that looks unrelated to the code.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
